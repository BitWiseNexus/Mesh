[project]
name = "mesh-backend"
version = "0.1.0"
description = "Mesh workflow execution engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "firebase-admin>=7.7.0",
    "litellm>=1.104.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
