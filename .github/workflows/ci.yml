name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: ./.github/actions/setup-firebase

      - name: Lint and format check
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Inside emulators:exec so the Auth/Firestore integration tests run; REQUIRE_EMULATORS makes
      # them fail (instead of skip) if the emulators somehow aren't reachable.
      - name: Tests (with Auth + Firestore emulators)
        env:
          REQUIRE_EMULATORS: "1"
        run: firebase emulators:exec --only auth,firestore --project demo-mesh "cd backend && uv run pytest -ra"

  frontend:
    name: Frontend · lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-mesh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-firebase
      - run: npm ci --prefix firebase
      - run: npm run test:rules

  e2e:
    name: End-to-end (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Read at `next build` time by the production server Playwright starts in CI.
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-mesh
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: ./.github/actions/setup-firebase
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          uv sync --project backend
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright starts the emulators, the API and a production build of the frontend.
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
