name: Set up Firebase emulators
description: Node, Java and the Firebase CLI, with the emulator downloads cached between runs.

inputs:
  firebase-tools-version:
    description: firebase-tools major version (keep in step with local development)
    default: "15"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24

    # The Firestore and Storage emulators are Java programs.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Cache emulator downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ runner.os }}-${{ inputs.firebase-tools-version }}

    - name: Install Firebase CLI
      shell: bash
      run: npm install --global firebase-tools@${{ inputs.firebase-tools-version }}
